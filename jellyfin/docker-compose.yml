services:
  jellyfin:
    image: jellyfin/jellyfin:10.9.11   # Specific version (recommended)
    container_name: jellyfin
    ports:
      - "8096:8096"    # Web UI (HTTP)
      # - "8920:8920"    # HTTPS (optional, only if enabled)
      # - "1900:1900/udp" # DLNA SSDP
      # - "7359:7359/udp" # Auto-discovery
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /home/fajaryae/media/movies:/media/movies:ro
    restart: unless-stopped
